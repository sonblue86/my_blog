<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" font-family="'Be Vietnam Pro', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Quy trình RAG: chuẩn bị tài liệu và trả lời câu hỏi</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16132f"/>
      <stop offset="1" stop-color="#231b55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a99dff"/>
    </marker>
  </defs>
  <rect width="960" height="760" rx="28" fill="url(#bg)"/>
  <rect width="960" height="760" rx="28" fill="url(#glow)"/>

  <!-- column titles -->
  <text x="40" y="72" fill="#ff9b7a" font-size="22" font-weight="700" letter-spacing="2">① CHUẨN BỊ · LÀM MỘT LẦN</text>
  <text x="500" y="72" fill="#ff9b7a" font-size="22" font-weight="700" letter-spacing="2">② MỖI KHI CÓ CÂU HỎI</text>

  <!-- left column -->
  <g>
    <rect x="40" y="104" width="420" height="100" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="68" y="148" fill="#f4f0ff" font-size="32" font-weight="700">Tài liệu</text>
    <text x="68" y="184" fill="#bdb7e0" font-size="23">PDF, wiki, ghi chú, email…</text>

    <rect x="40" y="248" width="420" height="100" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="68" y="292" fill="#f4f0ff" font-size="32" font-weight="700">Chia đoạn</text>
    <text x="68" y="328" fill="#bdb7e0" font-size="23">mỗi đoạn vài trăm chữ</text>

    <rect x="40" y="392" width="420" height="100" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="68" y="436" fill="#f4f0ff" font-size="32" font-weight="700">Tạo embedding</text>
    <text x="68" y="472" fill="#bdb7e0" font-size="23">đoạn văn → vector số</text>

    <rect x="40" y="536" width="420" height="100" rx="18" fill="#8b85ff" fill-opacity="0.2" stroke="#a99dff" stroke-width="2.5"/>
    <text x="68" y="580" fill="#ffffff" font-size="32" font-weight="700">Kho vector</text>
    <text x="68" y="616" fill="#d8d3ff" font-size="23">vector + văn bản gốc</text>

    <path d="M250 204 V242" stroke="#a99dff" stroke-width="3" fill="none" marker-end="url(#ah)"/>
    <path d="M250 348 V386" stroke="#a99dff" stroke-width="3" fill="none" marker-end="url(#ah)"/>
    <path d="M250 492 V530" stroke="#a99dff" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  </g>

  <!-- right column -->
  <g>
    <rect x="500" y="104" width="420" height="100" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="528" y="148" fill="#f4f0ff" font-size="32" font-weight="700">Câu hỏi</text>
    <text x="528" y="184" fill="#bdb7e0" font-size="23">“Đổi trả hàng trong mấy ngày?”</text>

    <rect x="500" y="248" width="420" height="100" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="528" y="292" fill="#f4f0ff" font-size="32" font-weight="700">Tìm đoạn liên quan</text>
    <text x="528" y="328" fill="#bdb7e0" font-size="23">so khớp vector, lấy top-k</text>

    <rect x="500" y="392" width="420" height="100" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="528" y="436" fill="#f4f0ff" font-size="32" font-weight="700">Ghép prompt</text>
    <text x="528" y="472" fill="#bdb7e0" font-size="23">câu hỏi + các đoạn tìm được</text>

    <rect x="500" y="536" width="420" height="100" rx="18" fill="#ff7a52" fill-opacity="0.16" stroke="#ff9b7a" stroke-width="2.5"/>
    <text x="528" y="580" fill="#ffffff" font-size="32" font-weight="700">LLM trả lời</text>
    <text x="528" y="616" fill="#ffd9cc" font-size="23">kèm trích dẫn nguồn</text>

    <path d="M710 204 V242" stroke="#a99dff" stroke-width="3" fill="none" marker-end="url(#ah)"/>
    <path d="M710 348 V386" stroke="#a99dff" stroke-width="3" fill="none" marker-end="url(#ah)"/>
    <path d="M710 492 V530" stroke="#a99dff" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  </g>

  <!-- vector store feeds retrieval -->
  <path d="M460 586 H480 V298 H494" stroke="#a99dff" stroke-width="3" stroke-dasharray="7 7" fill="none" marker-end="url(#ah)"/>

  <text x="480" y="706" fill="#d8d3ff" font-size="22" text-anchor="middle">Mô hình chỉ thấy những đoạn được tìm thấy — tìm đúng thì mới trả lời đúng.</text>
</svg>
